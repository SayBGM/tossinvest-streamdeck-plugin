<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src ws://localhost:* ws://127.0.0.1:*"
    />
    <meta name="color-scheme" content="dark" />
    <title>TossInvest 설정</title>
    <link rel="stylesheet" href="quote.css" />
  </head>
  <body>
    <main>
      <section class="card global-card" id="globalCard">
        <div class="header-row">
          <h1>TossInvest</h1>
          <span class="badge">Open API</span>
        </div>

        <!-- 저장 완료 시 노출되는 요약 바 -->
        <div id="savedKeyBadge" class="saved-badge" hidden>
          <div class="saved-badge-left">
            <span class="saved-badge-icon">✓</span>
            <div class="saved-badge-texts">
              <span class="saved-badge-title">API 자격증명 저장됨</span>
              <span id="savedBadgeClientId" class="saved-badge-id"></span>
            </div>
          </div>
          <button type="button" id="toggleGlobalBtn" class="toggle-btn">
            설정 변경 ▾
          </button>
        </div>

        <!-- 입력 필드 영역: 저장 완료 시 기본 접힘 -->
        <div id="globalFields" class="global-fields">
          <p class="notice">
            토스증권 공식 Open API를 사용하는 시세 플러그인입니다.
          </p>

          <label
            >Client ID<input
              id="clientId"
              placeholder="WTS에서 발급받은 Client ID"
              autocomplete="off"
              spellcheck="false"
          /></label>
          <label
            >Client Secret<input
              id="clientSecret"
              type="password"
              placeholder="Client Secret"
              autocomplete="off"
              spellcheck="false"
          /></label>
          <p class="hint">
            자격증명은 로컬 Stream Deck 설정에만 안전하게 저장됩니다.
          </p>

          <label
            >화면 갱신 주기
            <select id="renderMode">
              <option value="realtime">실시간 체결 (약 100ms)</option>
              <option value="economy">절약형 (1초)</option>
            </select>
          </label>

          <div class="buttons">
            <button id="saveGlobal">전역 설정 저장</button>
            <button id="testGlobal" class="secondary">연결 테스트</button>
          </div>
          <output id="globalStatus" aria-live="polite"></output>
        </div>
      </section>

      <!-- 1단계 완료 전 안내 가이드 -->
      <div id="setupGuide" class="card guide-card">
        <div class="guide-icon">🔒</div>
        <div class="guide-title">2단계: 시세 키 설정 대기</div>
        <div class="guide-desc">
          위의 <strong>Client ID</strong>와 <strong>Client Secret</strong>을
          입력하고<br />
          <strong>[전역 설정 저장]</strong>을 완료하면 종목을 선택할 수 있는
          2단계가 열립니다.
        </div>
      </div>

      <!-- 2단계: 시세 키 설정 (전역 설정 저장 시 노출) -->
      <section class="card" id="actionSection" hidden>
        <div class="header-row">
          <h2>시세 키 설정</h2>
          <span
            class="badge"
            style="
              background: rgba(0, 192, 115, 0.15);
              color: #00c073;
              border: 1px solid rgba(0, 192, 115, 0.3);
            "
            >2단계</span
          >
        </div>

        <!-- 인기 종목 빠른 선택 -->
        <div class="quick-picks-section">
          <div class="quick-title">인기 종목 빠른 선택</div>
          <div class="chips-group">
            <span class="chip-label">국내</span>
            <button type="button" class="chip" data-symbol="005930">
              삼성전자
            </button>
            <button type="button" class="chip" data-symbol="000660">
              SK하이닉스
            </button>
            <button type="button" class="chip" data-symbol="005380">
              현대차
            </button>
            <button type="button" class="chip" data-symbol="035420">
              NAVER
            </button>
          </div>
          <div class="chips-group">
            <span class="chip-label">미국</span>
            <button type="button" class="chip" data-symbol="AAPL">애플</button>
            <button type="button" class="chip" data-symbol="TSLA">
              테슬라
            </button>
            <button type="button" class="chip" data-symbol="NVDA">
              엔비디아
            </button>
            <button type="button" class="chip" data-symbol="MSFT">MSFT</button>
          </div>
        </div>

        <!-- 종목 코드 / 티커 직접 입력 -->
        <label
          >종목 코드 / 티커
          <div class="input-with-button">
            <input
              id="symbol"
              placeholder="005930 또는 AAPL"
              autocomplete="off"
              spellcheck="false"
            />
            <button id="resolve" class="action-btn">확인</button>
          </div>
        </label>

        <div id="resolved" class="resolved" hidden></div>

        <!-- 옵션: 색상 테마 및 키 동작 -->
        <div class="option-grid">
          <label
            >색상 테마
            <select id="colorTheme">
              <option value="kr">한국형 (빨강 상승 / 파랑 하락)</option>
              <option value="global">글로벌 (초록 상승 / 빨강 하락)</option>
            </select>
          </label>

          <label
            >키 누르기 동작
            <select id="keyBehavior">
              <option value="refresh">즉시 새로고침</option>
              <option value="toggle-view">화면 모드 전환 (차트 ↔ 상세)</option>
              <option value="open">토스증권 웹에서 종목 열기</option>
              <option value="none">동작 없음</option>
            </select>
          </label>
        </div>

        <div class="checkbox-row">
          <label class="checkbox-label">
            <input type="checkbox" id="showCurrencySymbol" checked /> 통화 기호
            (₩/$) 표시
          </label>
        </div>

        <!-- 화면 모드 탭 + Stream Deck 키 미리보기 결합 영역 -->
        <div class="preview-tab-section">
          <div class="preview-section-header">
            <span class="preview-section-title"
              >화면 모드 선택 & 키 미리보기</span
            >
          </div>

          <select id="viewMode" hidden>
            <option value="chart">차트 모드</option>
            <option value="detail">시세 모드</option>
          </select>

          <div class="view-mode-tabs" role="tablist">
            <button
              type="button"
              class="view-mode-tab active"
              data-mode="chart"
            >
              <span class="tab-icon">📈</span>
              <span class="tab-text">차트 모드</span>
            </button>
            <button type="button" class="view-mode-tab" data-mode="detail">
              <span class="tab-icon">📋</span>
              <span class="tab-text">시세 모드</span>
            </button>
          </div>

          <div class="preview-wrapper">
            <div class="preview-box">
              <img id="keyPreview" alt="키 미리보기" width="96" height="96" />
            </div>
            <div id="viewModeDesc" class="preview-mode-desc">
              현재가, 등락폭, 미니 차트가 함께 표시됩니다.
            </div>
          </div>
        </div>

        <output id="actionStatus" aria-live="polite"></output>
      </section>
    </main>
    <script src="sdpi.js"></script>
    <script src="quote.js"></script>
  </body>
</html>
